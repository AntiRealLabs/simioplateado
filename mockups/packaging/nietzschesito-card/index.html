<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NIETZSCHESITO.v01 · tarjeta de empaque (80 x 160 mm)</title>
  <style>
    :root {
      --paper: #f7f1e4;
      --paper-deep: #eee4d0;
      --ink: #111;
      --muted: #6f6a60;
      --gold: #b88a2a;
      --cyan: #7ff3ff;
      --magenta: #ff63df;
    }

    * { box-sizing: border-box; }

    @page {
      size: 80mm 160mm;
      margin: 0;
    }

    body {
      margin: 0;
      background: #f3f3f1;
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .sheet {
      min-height: 100vh;
      padding: 42px;
      display: flex;
      gap: 34px;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 320px;
      height: 640px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(255,255,255,0.85), transparent 24%),
        linear-gradient(135deg, rgba(0,0,0,0.025), transparent 34%),
        var(--paper);
      border: 1.4px solid var(--ink);
      box-shadow: 0 18px 46px rgba(0,0,0,0.13);
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(17,17,17,0.18);
      pointer-events: none;
    }

    .front {
      padding: 22px 20px 22px;
      display: flex;
      flex-direction: column;
    }

    .front .topline,
    .back .topline {
      position: relative;
      z-index: 4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "Menlo", "JetBrains Mono", monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .front .edition {
      color: var(--muted);
    }

    .figure-stage {
      position: relative;
      z-index: 2;
      flex: 1;
      margin: 10px 0 6px;
      border: 1px solid rgba(17,17,17,0.16);
      background:
        linear-gradient(90deg, transparent 0 49%, rgba(17,17,17,0.08) 49% 50%, transparent 50%),
        linear-gradient(180deg, transparent 0 49%, rgba(17,17,17,0.08) 49% 50%, transparent 50%),
        rgba(255,255,255,0.33);
    }

    .figure-stage::before {
      content: "";
      position: absolute;
      inset: 42px 18px;
      border: 1px dashed rgba(17,17,17,0.2);
      transform: rotate(-2deg);
    }

    .figure-main {
      position: absolute;
      z-index: 4;
      left: 34px;
      bottom: 22px;
      width: 212px;
      height: 460px;
      object-fit: contain;
      object-position: bottom center;
      filter: drop-shadow(0 18px 18px rgba(0,0,0,0.16));
    }

    .ghost {
      position: absolute;
      z-index: 3;
      object-fit: contain;
      opacity: 0.74;
      mix-blend-mode: multiply;
      filter: saturate(1.35) contrast(1.05);
    }

    .ghost.glitch {
      width: 97px;
      height: 170px;
      top: 31px;
      right: 16px;
      border: 1px solid rgba(255,99,223,0.45);
      background: #333;
      transform: rotate(3deg);
    }

    .ghost.holo {
      width: 86px;
      height: 164px;
      left: 15px;
      top: 46px;
      border: 1px solid rgba(127,243,255,0.5);
      background: #3a3d3e;
      transform: rotate(-4deg);
      opacity: 0.78;
    }

    .spray {
      position: absolute;
      z-index: 1;
      border-radius: 50%;
      filter: blur(18px);
      opacity: 0.45;
    }

    .spray.one {
      width: 172px;
      height: 230px;
      right: -54px;
      top: 96px;
      background: var(--magenta);
    }

    .spray.two {
      width: 156px;
      height: 208px;
      left: -57px;
      bottom: 94px;
      background: var(--cyan);
    }

    .front-title {
      position: relative;
      z-index: 4;
      padding: 12px 0 0;
      border-top: 1px solid var(--ink);
    }

    .front-title h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1;
      letter-spacing: 0.02em;
      font-weight: 900;
    }

    .front-title p {
      margin: 8px 0 0;
      font-family: "Menlo", "JetBrains Mono", monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .front-title .batch {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      font-family: "Menlo", "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .back {
      padding: 26px 24px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .back .topline {
      width: 100%;
      margin-bottom: 28px;
    }

    .brand-wordmark {
      width: 210px;
      height: 150px;
      object-fit: contain;
      margin: 6px 0 0;
      opacity: 0.92;
      filter: contrast(1.38) brightness(0.72);
      transform: rotate(-2deg);
    }

    .rule {
      width: 138px;
      height: 11px;
      margin: 26px auto 40px;
      border-bottom: 3px solid var(--gold);
      transform: rotate(-1deg);
    }

    .quote {
      position: relative;
      z-index: 3;
      max-width: 240px;
      margin: 0 auto;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      line-height: 1.18;
      font-weight: 700;
    }

    .quote::before,
    .quote::after {
      color: var(--gold);
      font-size: 46px;
      line-height: 0;
      position: absolute;
      opacity: 0.7;
    }

    .quote::before {
      content: "“";
      left: -18px;
      top: 14px;
    }

    .quote::after {
      content: "”";
      right: -20px;
      bottom: 0;
    }

    .source {
      margin: 18px 0 0;
      font-family: "Menlo", "JetBrains Mono", monospace;
      font-size: 9px;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .signature {
      margin-top: auto;
      width: 138px;
      height: 100px;
      object-fit: contain;
      opacity: 0.78;
      filter: grayscale(1) contrast(1.35);
      transform: rotate(-4deg);
    }

    .stamp {
      position: absolute;
      right: 24px;
      bottom: 34px;
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border: 1.4px solid var(--ink);
      border-radius: 50%;
      font-family: "Menlo", "JetBrains Mono", monospace;
      font-size: 16px;
      font-weight: 800;
      transform: rotate(8deg);
      opacity: 0.48;
    }

    .scratch {
      position: absolute;
      height: 2px;
      background: var(--ink);
      opacity: 0.32;
      transform-origin: left center;
    }

    .scratch.a { width: 64px; left: 26px; top: 152px; transform: rotate(-12deg); }
    .scratch.b { width: 90px; right: 22px; top: 198px; transform: rotate(7deg); }
    .scratch.c { width: 74px; left: 40px; bottom: 120px; transform: rotate(5deg); }

    .gold-smudge {
      position: absolute;
      width: 100px;
      height: 30px;
      left: 34px;
      bottom: 100px;
      background: linear-gradient(90deg, transparent, rgba(184,138,42,0.7), transparent);
      filter: blur(7px);
      transform: rotate(-8deg);
      opacity: 0.58;
    }

    .print-note {
      position: fixed;
      left: 16px;
      bottom: 14px;
      color: #777;
      font-family: "Menlo", monospace;
      font-size: 11px;
    }

    @media print {
      html, body { background: white; margin: 0; padding: 0; }
      .sheet {
        padding: 0;
        min-height: auto;
        display: block;
        gap: 0;
      }
      .card {
        box-shadow: none;
        border: none;
        width: 80mm;
        height: 160mm;
        page-break-after: always;
        break-after: page;
      }
      .card:last-child {
        page-break-after: auto;
        break-after: auto;
      }
      .print-note { display: none; }
    }
  </style>
</head>
<body>
  <main class="sheet" aria-label="Mockup de tarjeta doble para NIETZSCHESITO.v01">
    <section class="card front" aria-label="Frente de tarjeta">
      <div class="topline">
        <span>SIMIO PLATEADO</span>
        <span class="edition">FDM / V01</span>
      </div>

      <div class="figure-stage">
        <div class="spray one"></div>
        <div class="spray two"></div>
        <img class="ghost holo" src="assets/nietzschesito-hologram.png" alt="Version holografica del modelo 3D">
        <img class="ghost glitch" src="assets/nietzschesito-glitch.png" alt="Version digital glitch del modelo 3D">
        <img class="figure-main" src="assets/nietzschesito-color.png" alt="Version 3D a color de Nietzschesito">
      </div>

      <div class="front-title">
        <h1>NIETZSCHESITO.v01</h1>
        <p>objeto FDM · aerosol · archivo vivo</p>
        <div class="batch">
          <span>SP-001</span>
        <span>Medellín</span>
        </div>
      </div>
    </section>

    <section class="card back" aria-label="Reverso de tarjeta">
      <div class="topline">
        <span>certificado mínimo</span>
        <span>SP-001</span>
      </div>

      <img class="brand-wordmark" src="assets/brand-wordmark-real.png" alt="Logotipo Simio Plateado">
      <div class="rule"></div>

      <p class="quote">El humano es algo que debe ser superado.</p>
      <p class="source">F. Nietzsche · Así habló Zaratustra</p>

      <div class="scratch a"></div>
      <div class="scratch b"></div>
      <div class="scratch c"></div>
      <div class="gold-smudge"></div>
      <img class="signature" src="assets/firma-jdme.png" alt="Firma">
      <div class="stamp">SP</div>
    </section>
  </main>

  <div class="print-note">Vista mockup · listo para imprimir a 80 x 160 mm / 8 x 16 cm (una tarjeta por página)</div>
</body>
</html>
