<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Central · Simio Plateado</title>
  <style>
    :root {
      --paper: #fff;
      --ink: #0b0b0b;
      --muted: #777;
      --line: #0b0b0b;
      --soft: #f5f5f5;
      --ok: #0f6b35;
      --warn: #8a5a00;
      --bad: #9b1c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
      line-height: 1.45;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      align-items: center;
      padding: 1rem 1.4rem;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 1rem; letter-spacing: 0.08em; text-transform: uppercase; }
    h2 { font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    button, input, select, textarea {
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 0;
      background: var(--paper);
      color: var(--ink);
    }
    button {
      padding: 0.7rem 0.9rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.74rem;
      font-weight: 700;
    }
    button.primary { background: var(--ink); color: var(--paper); }
    button:disabled { opacity: 0.5; cursor: default; }
    input, select, textarea {
      width: 100%;
      padding: 0.7rem 0.8rem;
    }
    textarea { min-height: 6rem; resize: vertical; }
    .shell {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(360px, 0.8fr);
      gap: 1rem;
      padding: 1rem;
    }
    .panel {
      border: 1px solid var(--line);
      min-height: 8rem;
      background: var(--paper);
    }
    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 0.8rem;
      align-items: center;
      padding: 0.9rem;
      border-bottom: 1px solid var(--line);
    }
    .panel-body { padding: 0.9rem; }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 0.7rem;
      align-items: end;
    }
    .auth {
      display: grid;
      grid-template-columns: minmax(180px, 260px) auto;
      gap: 0.6rem;
      align-items: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      padding: 0.7rem 0.65rem;
      border-bottom: 1px solid #ddd;
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    th {
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    tr[data-active="true"] { background: var(--soft); }
    .tag {
      display: inline-block;
      border: 1px solid var(--line);
      padding: 0.18rem 0.42rem;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .tag.ok { color: var(--ok); border-color: var(--ok); }
    .tag.warn { color: var(--warn); border-color: var(--warn); }
    .tag.bad { color: var(--bad); border-color: var(--bad); }
    .detail-grid, .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
    }
    .field {
      display: grid;
      gap: 0.28rem;
    }
    .field span {
      font-size: 0.66rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }
    .field strong { font-weight: 700; }
    .wide { grid-column: 1 / -1; }
    .inventory {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.7rem;
    }
    .stock-card {
      border: 1px solid var(--line);
      padding: 0.8rem;
      display: grid;
      gap: 0.35rem;
    }
    .muted { color: var(--muted); }
    .status-line {
      min-height: 1.2rem;
      color: var(--muted);
    }
    .error { color: var(--bad); }
    @media (max-width: 980px) {
      .shell { grid-template-columns: 1fr; }
      .detail-grid, .status-grid, .toolbar, .auth, .inventory { grid-template-columns: 1fr; }
      header { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Central · Simio Plateado</h1>
      <p class="muted">Pedidos, pago, envío e inventario inicial. Acceso temporal con clave única.</p>
    </div>
    <div class="auth">
      <input id="adminPassword" type="password" autocomplete="current-password" placeholder="Clave Central">
      <button id="savePassword">Entrar</button>
    </div>
  </header>

  <main class="shell">
    <section class="panel">
      <div class="panel-head">
        <h2>Órdenes</h2>
        <div class="toolbar">
          <input id="search" placeholder="Buscar por orden, email, producto o ciudad">
          <button id="refresh">Actualizar</button>
          <button id="exportCsv">Exportar CSV</button>
        </div>
      </div>
      <div class="panel-body">
        <div class="status-line" id="ordersStatus"></div>
        <table>
          <thead>
            <tr>
              <th>Orden</th>
              <th>Producto</th>
              <th>Cliente</th>
              <th>Pago</th>
              <th>Fulfillment</th>
              <th>Fecha</th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
    </section>

    <aside class="panel">
      <div class="panel-head">
        <h2>Detalle</h2>
        <span id="selectedId" class="muted">sin selección</span>
      </div>
      <div class="panel-body">
        <div id="detailEmpty" class="muted">Selecciona una orden para ver dirección, guía y notas.</div>
        <div id="detail" hidden>
          <div class="detail-grid" id="detailGrid"></div>
          <hr>
          <div class="status-grid">
            <label class="field wide">
              <span>Estado fulfillment</span>
              <select id="fulfillmentStatus">
                <option value="PENDIENTE_PAGO">PENDIENTE_PAGO</option>
                <option value="PAGADO">PAGADO</option>
                <option value="EN_PRODUCCION">EN_PRODUCCION</option>
                <option value="EMPACADO">EMPACADO</option>
                <option value="ENVIADO">ENVIADO</option>
                <option value="ENTREGADO">ENTREGADO</option>
                <option value="CANCELADO">CANCELADO</option>
              </select>
            </label>
            <label class="field"><span>Transportadora</span><input id="carrier" placeholder="Coordinadora, DHL, Interrapidísimo..."></label>
            <label class="field"><span>Guía</span><input id="tracking" placeholder="Número de guía"></label>
            <label class="field wide"><span>Notas internas</span><textarea id="internalNotes" placeholder="Producción, empaque, novedades..."></textarea></label>
            <button class="primary wide" id="saveStatus">Guardar estado</button>
            <div class="status-line wide" id="saveStatusLine"></div>
          </div>
        </div>
      </div>
    </aside>

    <section class="panel">
      <div class="panel-head">
        <h2>Inventario</h2>
        <button id="refreshInventory">Actualizar</button>
      </div>
      <div class="panel-body">
        <div class="inventory" id="inventory"></div>
      </div>
    </section>
  </main>

  <script>
    const API_BASE = 'https://api.simioplateado.com';
    const PASSWORD_KEY = 'simio-central-access-code';
    let orders = [];
    let selectedOrder = null;

    const $ = (id) => document.getElementById(id);

    function authHeaders() {
      const password = $('adminPassword').value || localStorage.getItem(PASSWORD_KEY) || '';
      return password ? { 'X-Simio-Central-Code': password } : {};
    }

    async function api(path, options = {}) {
      const response = await fetch(API_BASE + path, {
        ...options,
        credentials: 'include',
        headers: {
          ...(options.headers || {}),
          ...authHeaders()
        }
      });
      const contentType = response.headers.get('Content-Type') || '';
      const data = contentType.includes('application/json') ? await response.json() : await response.text();
      if (!response.ok) {
        const message = data && data.message ? data.message : 'No autorizado o error de API.';
        throw new Error(message);
      }
      return data;
    }

    function tag(value) {
      const text = value || 'SIN_ESTADO';
      const cls = text === 'PAGADO' || text === 'approved' || text === 'ENTREGADO' ? 'ok' : text.includes('ERROR') || text === 'CANCELADO' ? 'bad' : 'warn';
      return '<span class="tag ' + cls + '">' + escapeHtml(text) + '</span>';
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function filteredOrders() {
      const q = $('search').value.trim().toLowerCase();
      if (!q) return orders;
      return orders.filter((order) => [
        order.id,
        order.pieza,
        order.title,
        order.cliente_nombre,
        order.cliente_email,
        order.ciudad,
        order.estado_pago,
        order.estado_fulfillment
      ].join(' ').toLowerCase().includes(q));
    }

    function renderOrders() {
      const body = $('ordersBody');
      const rows = filteredOrders();
      body.innerHTML = rows.map((order) => `
        <tr data-id="${escapeHtml(order.id)}" data-active="${selectedOrder && selectedOrder.id === order.id}">
          <td><button data-open="${escapeHtml(order.id)}">${escapeHtml(order.id)}</button></td>
          <td>${escapeHtml(order.title || order.pieza)}<br><span class="muted">${escapeHtml(order.slug)}</span></td>
          <td>${escapeHtml(order.cliente_nombre || '')}<br><span class="muted">${escapeHtml(order.cliente_email || '')}</span></td>
          <td>${tag(order.estado_pago || order.mp_status)}</td>
          <td>${tag(order.estado_fulfillment)}</td>
          <td>${escapeHtml((order.fecha || '').slice(0, 10))}</td>
        </tr>
      `).join('');

      body.querySelectorAll('[data-open]').forEach((button) => {
        button.addEventListener('click', () => openOrder(button.dataset.open));
      });
      $('ordersStatus').textContent = rows.length + ' orden(es)';
    }

    async function loadOrders() {
      $('ordersStatus').textContent = 'Cargando órdenes...';
      const data = await api('/api/central/orders');
      orders = data.orders || [];
      renderOrders();
    }

    async function openOrder(id) {
      $('selectedId').textContent = id;
      const data = await api('/api/central/orders/' + encodeURIComponent(id));
      selectedOrder = data.order;
      $('detailEmpty').hidden = true;
      $('detail').hidden = false;
      $('fulfillmentStatus').value = selectedOrder.estado_fulfillment || 'PENDIENTE_PAGO';
      $('carrier').value = selectedOrder.transportadora || '';
      $('tracking').value = selectedOrder.guia || '';
      $('internalNotes').value = selectedOrder.notas_internas || '';
      $('saveStatusLine').textContent = '';
      $('detailGrid').innerHTML = detailFields(selectedOrder);
      renderOrders();
    }

    function detailFields(order) {
      const direccion = order.direccion || {};
      const fields = [
        ['Producto', order.title || order.pieza],
        ['Monto', `USD ${order.monto_usd} / COP ${order.monto}`],
        ['Pago', `${order.estado_pago || ''} · ${order.mp_status || ''}`],
        ['MP payment', order.mp_payment_id || 'pendiente'],
        ['Cliente', order.cliente_nombre],
        ['Email', order.cliente_email],
        ['Teléfono', order.cliente_telefono],
        ['Ciudad', direccion.ciudad],
        ['Dirección', direccion.linea1, true],
        ['Departamento', direccion.departamento],
        ['País', direccion.pais],
        ['Código postal', direccion.codigo_postal],
        ['Notas envío', direccion.notas || 'sin notas', true],
      ];

      return fields.map(([label, value, wide]) => `
        <div class="field ${wide ? 'wide' : ''}">
          <span>${escapeHtml(label)}</span>
          <strong>${escapeHtml(value || '')}</strong>
        </div>
      `).join('');
    }

    async function saveStatus() {
      if (!selectedOrder) return;
      $('saveStatusLine').textContent = 'Guardando...';
      const data = await api('/api/central/orders/' + encodeURIComponent(selectedOrder.id) + '/status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          estado_fulfillment: $('fulfillmentStatus').value,
          transportadora: $('carrier').value,
          guia: $('tracking').value,
          notas_internas: $('internalNotes').value
        })
      });
      selectedOrder = data.order;
      $('saveStatusLine').textContent = 'Guardado.';
      await loadOrders();
      await openOrder(selectedOrder.id);
    }

    async function loadInventory() {
      const data = await api('/api/central/inventory');
      $('inventory').innerHTML = (data.inventory || []).map((item) => `
        <div class="stock-card">
          <strong>${escapeHtml(item.name)}</strong>
          <span class="muted">USD ${escapeHtml(item.price_usd)} · COP ${escapeHtml(item.price_cop)}</span>
          <span>${tag(item.checkout_enabled ? 'ACTIVO' : 'PAUSADO')}</span>
          <span>Stock: ${escapeHtml(item.stock)} · Vendidos: ${escapeHtml(item.sold)} · Disponibles: ${escapeHtml(item.available)}</span>
        </div>
      `).join('');
    }

    async function exportCsv() {
      $('ordersStatus').textContent = 'Preparando CSV...';
      $('ordersStatus').classList.remove('error');

      try {
        const response = await fetch(API_BASE + '/api/central/export', {
          credentials: 'include',
          headers: authHeaders()
        });

        if (!response.ok) throw new Error('No se pudo exportar el CSV.');

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'simio-central-orders.csv';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        $('ordersStatus').textContent = 'CSV exportado.';
      } catch (error) {
        $('ordersStatus').textContent = error.message;
        $('ordersStatus').classList.add('error');
      }
    }

    $('savePassword').addEventListener('click', async () => {
      localStorage.setItem(PASSWORD_KEY, $('adminPassword').value || '');
      await boot();
    });
    $('refresh').addEventListener('click', loadOrders);
    $('refreshInventory').addEventListener('click', loadInventory);
    $('search').addEventListener('input', renderOrders);
    $('saveStatus').addEventListener('click', saveStatus);
    $('exportCsv').addEventListener('click', exportCsv);

    async function boot() {
      $('ordersStatus').classList.remove('error');
      $('ordersStatus').textContent = '';
      try {
        await Promise.all([loadOrders(), loadInventory()]);
      } catch (error) {
        $('ordersStatus').textContent = error.message;
        $('ordersStatus').classList.add('error');
      }
    }

    $('adminPassword').value = localStorage.getItem(PASSWORD_KEY) || '';
    boot();
  </script>
</body>
</html>
