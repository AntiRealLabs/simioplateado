name = "simio-watchdog"
main = "worker.js"
compatibility_date = "2026-06-01"
workers_dev = true

[vars]
HEALTH_URL = "https://api.simioplateado.com/api/health"
FAIL_THRESHOLD = "2"
ALERT_COOLDOWN_SECONDS = "14400"
HISTORY_SIZE = "50"
ADMIN_EMAIL = "el@simioplateado.com"
EMAIL_FROM = "noreply@simioplateado.com"

[triggers]
crons = ["*/15 * * * *"]

# Namespace compartido con simio-sondeo para que el watchdog sea desplegable ya.
# El worker solo escribe claves prefijadas con "watchdog:".
[[kv_namespaces]]
binding = "WATCHDOG"
id = "4083728a65294e4f990368d487cef93b"

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@simioplateado.com"]
